name: Correggi diciture liceo homepage
on:
  push:
    paths:
      - '.github/workflows/correggi-diciture-liceo-home.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correggi solo le diciture visibili in homepage
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '                                Liceo Scientifico Scienze Applicate\n'
          new1 = '                                LS - Liceo Scientifico Opzione Scienze Applicate\n'
          old2 = '                                Liceo Scientifico Opzione Scienze Applicate - Curvatura Economica\n'
          new2 = '                                LS - Liceo Scienze Applicate - Curvatura Economica\n'
          assert s.count(old1) == 1, f'Dicitura ordinaria trovata {s.count(old1)} volte'
          assert s.count(old2) == 1, f'Dicitura curvatura trovata {s.count(old2)} volte'
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verifica diciture
        run: |
          grep -Fq 'LS - Liceo Scientifico Opzione Scienze Applicate' index.html
          grep -Fq 'LS - Liceo Scienze Applicate - Curvatura Economica' index.html
          ! grep -Fq '>Liceo Scientifico Scienze Applicate<' index.html || exit 1
      - name: Pubblica modifica e rimuove workflow temporaneo
        run: |
          git config user.name 'giuseppeborzumati-cmyk'
          git config user.email 'giuseppe.borzumati@leviseregno.edu.it'
          git add index.html
          git rm .github/workflows/correggi-diciture-liceo-home.yml
          git commit -m 'Corregge diciture liceo nella homepage MiniStage'
          git push
