name: Applica chiusura automatica MiniStage
on:
  push:
    paths:
      - 'tools/apply_auto_closure_pergamena_v1.py'
      - '.github/workflows/apply-auto-closure-pergamena-v1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica patch
        run: python tools/apply_auto_closure_pergamena_v1.py
      - name: Verifica sintassi JavaScript
        run: node --check ministage-complete.js && node --check ministage-admin-console-v2.js && node --check ministage-admin-console-v2-original.js
      - name: Verifica funzioni richieste
        run: |
          grep -q "Scarica PDF" index.html
          ! grep -q "Stampa o Salva PDF" index.html
          grep -q "function processDueClosures" ministage-complete.js
          grep -q "type: EXITED" ministage-complete.js
          grep -q "mini-page-closure" ministage-admin-console-v2-original.js
          grep -q "Usciti / pergamena inviata" ministage-admin-console-v2-original.js
          echo AUTO_CLOSURE_CHECK_OK
      - name: Commit finale e pulizia strumenti temporanei
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html ministage-complete.js ministage-admin-console-v2.js ministage-admin-console-v2-original.js
          git rm tools/apply_auto_closure_pergamena_v1.py .github/workflows/apply-auto-closure-pergamena-v1.yml
          git commit -m "Aggiunge download PDF diretto e chiusura automatica MiniStage"
          git push
