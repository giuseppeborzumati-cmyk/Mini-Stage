name: Deep audit patch MiniStage
on:
  push:
    paths:
      - 'tools/deep_audit_patch_v1.py'
      - '.github/workflows/deep-audit-patch-v1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audit fixes
        run: python tools/deep_audit_patch_v1.py
      - name: JavaScript syntax
        run: |
          node --check ministage-complete.js
          node --check ministage-admin-console-v2.js
      - name: Static guards
        run: |
          grep -F "s.indirizzo === ind && s.active !== false" index.html
          grep -F "SLOT_INACTIVE" ministage-complete.js
          grep -F "lista d’attesa e non può essere registrato come presente" index.html
          grep -F "non viene rigenerato alcun pass valido" index.html
          grep -F "Prenotazione richiesta" index.html
          grep -F "v=20260906g" index.html
          echo DEEP_AUDIT_GUARDS_OK
      - name: Commit final files
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html ministage-complete.js
          git commit -m "Corregge casi limite emersi dall audit completo"
          git rm tools/deep_audit_patch_v1.py .github/workflows/deep-audit-patch-v1.yml
          git commit -m "Rimuove strumenti temporanei audit"
          git push
