name: Fix mobile email MiniStage
on:
  push:
    paths:
      - 'tools/fix_mobile_email_delivery_v1.py'
      - '.github/workflows/fix-mobile-email-v1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/fix_mobile_email_delivery_v1.py
      - name: Check JavaScript
        run: node --check ministage-complete.js && node --check ministage-admin-console-v2.js
      - name: Verify mobile and email guards
        run: |
          grep -q "mode:'no-cors'" ministage-complete.js
          test "$(grep -c "mode: 'no-cors'" index.html)" -ge 4
          grep -q "100dvh" index.html
          grep -q "sticky bottom-0" index.html
          grep -q "20260906f" index.html
          echo MOBILE_FULL_CHECK_OK
      - name: Commit final files
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html ministage-complete.js
          git rm tools/fix_mobile_email_delivery_v1.py .github/workflows/fix-mobile-email-v1.yml
          git commit -m "Corregge invio email e completa verifica mobile MiniStage"
          git push
