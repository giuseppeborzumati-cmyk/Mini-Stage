name: Apply MiniStage final

on:
  push:
    branches:
      - main
    paths:
      - patch-ministage.py
      - .github/workflows/apply-ministage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 patch-ministage.py

      - name: Verify JavaScript and final structure
        run: |
          node --check ministage-complete.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          js = Path('ministage-complete.js').read_text(encoding='utf-8')
          required_html = [
              '<!DOCTYPE html>',
              'Descrizione dei MiniStage',
              '14:30 – 16:30',
              'ore 14:15',
              'massimo di <strong>25 studenti</strong>',
              'container-curvatura-economica',
              'Liceo Scientifico - Opzione Scienze Applicate con Curvatura Economica',
              'Sistema Moda - Istituto Tecnico',
              'window.__miniStageCore',
              '<script src="ministage-complete.js"></script>'
          ]
          required_js = [
              'lista_attesa',
              'ISCRIZIONE CON RISERVA',
              'Ammesso da scorrimento',
              'downloadWaitlistPdf',
              'downloadAllClassListsPdf',
              'createSmartphoneScannerLink',
              'authorizationPaperReceived',
              'DEFAULT_CAPACITY = 25'
          ]
          missing = [x for x in required_html if x not in s] + [x for x in required_js if x not in js]
          if missing:
              raise SystemExit('Mancano: ' + ' | '.join(missing))
          for bad in ('2026-11-06','2026-11-20','06/11/2026','20/11/2026'):
              if bad in s or bad in js:
                  raise SystemExit('Data hard-coded trovata: ' + bad)
          print('MINISTAGE_FINAL_STATIC_OK')
          PY

      - name: Commit applied files
        run: |
          rm -f patch-ministage.py
          rm -f .github/workflows/apply-ministage.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Applica MiniStage completo stabile e nuovo percorso"
          git push
