name: Restore MiniStage unified module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Restore unified JavaScript and link it
        env:
          MOD_B64_GZ: 
        run: |
          echo "$MOD_B64_GZ" | base64 -d | gzip -d > ministage-autorizzazione.js
          node --check ministage-autorizzazione.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="ministage-autorizzazione.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html non contiene </body>')
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit restored runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ministage-autorizzazione.js
          if git diff --cached --quiet; then
            echo "Runtime già ripristinato"
          else
            git commit -m "Ripristina runtime MiniStage unificato"
            git push
          fi
