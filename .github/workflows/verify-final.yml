name: Verify MiniStage final

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-final.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and static checks
        run: |
          node --check ministage-complete.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=Path('ministage-complete.js').read_text(encoding='utf-8')
          assert s.startswith('<!DOCTYPE html>')
          assert 'Descrizione dei MiniStage' in s
          assert 'Liceo Scientifico - Opzione Scienze Applicate con Curvatura Economica' in s
          assert 'Sistema Moda - Istituto Tecnico' in s
          assert 'window.__miniStageCore' in s
          assert '<script src="ministage-complete.js"></script>' in s
          assert 'lista_attesa' in js
          assert 'ISCRIZIONE CON RISERVA' in js
          assert 'Ammesso da scorrimento' in js
          assert 'downloadWaitlistPdf' in js
          assert 'downloadAllClassListsPdf' in js
          assert 'DEFAULT_CAPACITY = 25' in js
          for d in ('2026-11-06','2026-11-20','06/11/2026','20/11/2026'):
              assert d not in s and d not in js
          print('STATIC_FINAL_OK')
          PY
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install chromium >/dev/null
      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/ministage-http.log 2>&1 &
          sleep 2
      - name: Browser non destructive test
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1365,height:1000}});
            page.setDefaultTimeout(15000);
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8000/?verify=final',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>typeof window.openManageBookingModal==='function' && typeof window.showAdminView==='function');
            await page.evaluate(()=>window.goToHome());
            assert(!(await page.locator('#view-home').evaluate(e=>e.classList.contains('hidden'))),'Home non visibile');
            assert(await page.getByText('Descrizione dei MiniStage',{exact:true}).count()===1,'Descrizione MiniStage mancante');
            assert(await page.getByText('Liceo Scientifico - Opzione Scienze Applicate con Curvatura Economica',{exact:true}).count()>=1,'Nuovo percorso mancante');

            await page.getByRole('button',{name:'Recupera Prenotazione'}).click();
            assert(!(await page.locator('#manage-booking-modal').evaluate(e=>e.classList.contains('hidden'))),'Recupera non apre');
            await page.evaluate(()=>window.closeManageBookingBookingModal());

            await page.getByRole('button',{name:'Cancella Prenotazione'}).click();
            assert(!(await page.locator('#manage-booking-modal').evaluate(e=>e.classList.contains('hidden'))),'Cancella non apre');
            await page.evaluate(()=>window.closeManageBookingBookingModal());

            await page.getByRole('button',{name:/Accesso Commissione Orientamento/i}).click();
            assert(!(await page.locator('#view-admin').evaluate(e=>e.classList.contains('hidden'))),'Commissione non apre');
            assert(!(await page.locator('#admin-login').evaluate(e=>e.classList.contains('hidden'))),'Login Commissione non visibile');
            await page.evaluate(()=>window.goToHome());

            await page.waitForFunction(()=>window.__MINISTAGE_COMPLETE__?.version,{timeout:25000});
            assert(await page.evaluate(()=>typeof window.openWaitlistModal==='function'),'openWaitlistModal assente');
            assert(await page.evaluate(()=>typeof window.downloadWaitlistPdf==='function'),'PDF riserve assente');
            assert(await page.evaluate(()=>typeof window.downloadAllClassListsPdf==='function'),'PDF tutte classi assente');
            assert(await page.evaluate(()=>typeof window.createSmartphoneScannerLink==='function'),'Scanner smartphone assente');

            await page.evaluate(()=>window.openBookingModal('TEST-ONLY','Liceo Scientifico - Scienze Applicate','Giorno','data manuale','14:30 - 16:30'));
            assert(!(await page.locator('#booking-modal').evaluate(e=>e.classList.contains('hidden'))),'Prenota non apre');
            assert(await page.locator('#mini-exit-auth').count()===1,'Autorizzazione uscita assente');
            await page.evaluate(()=>window.closeModal());

            await page.evaluate(()=>window.openWaitlistModal('TEST-ONLY','Liceo Scientifico - Scienze Applicate','Giorno','data manuale','14:30 - 16:30'));
            assert(!(await page.locator('#booking-modal').evaluate(e=>e.classList.contains('hidden'))),'Lista attesa non apre');
            assert(/Lista d'Attesa/i.test(await page.locator('#booking-modal h3').innerText()),'Modal lista attesa errato');
            await page.evaluate(()=>window.closeModal());

            assert(errors.length===0,'Errori JavaScript: '+errors.join(' | '));
            console.log('MINISTAGE_BROWSER_FINAL_OK');
            await browser.close();
          })().catch(e=>{console.error('FINAL_VERIFY_FAIL',e);process.exit(1)});
          NODE
