name: Diagnose MiniStage connectivity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-connectivity.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install chromium
      - name: Diagnose live GitHub Pages
        run: |
          cat > diag.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const consoleLines = [];
          const pageErrors = [];
          const failedRequests = [];
          const firebaseTraffic = [];
          page.on('console', msg => consoleLines.push(`${msg.type()}: ${msg.text()}`));
          page.on('pageerror', err => pageErrors.push(String(err)));
          page.on('requestfailed', req => failedRequests.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText || ''}`));
          page.on('response', res => {
            const u = res.url();
            if (/firebase|firestore|identitytoolkit|securetoken|googleapis\.com|gstatic\.com/.test(u)) firebaseTraffic.push(`${res.status()} ${res.request().method()} ${u}`);
          });
          const url = `https://giuseppeborzumati-cmyk.github.io/Mini-Stage/?diag=${Date.now()}`;
          let gotoError = '';
          try { await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 }); }
          catch (e) { gotoError = String(e); }
          await page.waitForTimeout(18000);
          const state = await page.evaluate(() => {
            const core = window.__miniStageCore;
            return {
              href: location.href,
              badge: document.getElementById('conn-badge')?.textContent || '',
              spinnerHidden: document.getElementById('loading-spinner')?.classList.contains('hidden') ?? null,
              homeHidden: document.getElementById('view-home')?.classList.contains('hidden') ?? null,
              firebaseImports: !!window.firebaseImports,
              core: !!core,
              authCurrentUser: !!core?.auth?.currentUser,
              authUid: core?.auth?.currentUser?.uid || null,
              completeState: window.__MINISTAGE_COMPLETE__ || null,
              adminState: window.__MINISTAGE_ADMIN_CONSOLE_V2__ || null,
              visibleStageText: Array.from(document.querySelectorAll('[id^="container-"]')).map(x => x.innerText).join(' | ').slice(0,1500)
            };
          });
          console.log('GOTO_ERROR=' + gotoError);
          console.log('STATE=' + JSON.stringify(state));
          console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors));
          console.log('FAILED_REQUESTS=' + JSON.stringify(failedRequests));
          console.log('FIREBASE_TRAFFIC=' + JSON.stringify(firebaseTraffic));
          console.log('CONSOLE=' + JSON.stringify(consoleLines));
          await page.close({ runBeforeUnload: false }).catch(()=>{});
          await browser.close().catch(()=>{});
          NODE
          timeout 70s node diag.mjs
