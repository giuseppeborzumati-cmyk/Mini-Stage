name: Corregge dicitura Curvatura Economica
on:
  push:
    paths:
      - 'tools/fix_curvatura_label.py'
      - '.github/workflows/fix-curvatura-label.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica correzione dicitura
        run: python tools/fix_curvatura_label.py
      - name: Verifica JavaScript
        run: node --check ministage-complete.js && node --check ministage-admin-console-v2.js
      - name: Verifica dicitura pubblica
        run: |
          grep -q "Liceo Scienze Applicate - Curvatura Economica" index.html
          grep -q "CURVATURA_PUBLIC_LABEL" ministage-complete.js
          grep -q "20260907-curvatura1" index.html
      - name: Commit finale e pulizia
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html ministage-complete.js
          git rm tools/fix_curvatura_label.py .github/workflows/fix-curvatura-label.yml
          git commit -m "Aggiorna dicitura Curvatura Economica nel MiniStage"
          git push
