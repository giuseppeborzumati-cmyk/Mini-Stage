name: Apply auth and waitlist v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auth-waitlist-v3.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/apply_auth_waitlist_v3.py
      - name: Check JavaScript
        run: node --check ministage-complete.js
      - name: Verify requested text and waitlist guards
        run: |
          grep -q "documento di riconoscimento in corso di validità del genitore/tutore" index.html
          grep -q "Nome e cognome del genitore/tutore" ministage-complete.js
          grep -q "ALLEGATO:" ministage-complete.js
          grep -q "slot.active === false" ministage-complete.js
          grep -q "scheduleReconcile(160)" ministage-complete.js
          grep -q "ISCRIZIONE CON RISERVA" ministage-complete.js
          grep -q "NON VALIDO COME PASS DI ACCESSO" ministage-complete.js
          grep -q "waitlistPositionAtPromotion: 1" ministage-complete.js
      - name: Commit final files
        run: |
          rm -f tools/apply_auth_waitlist_v3.py .github/workflows/apply-auth-waitlist-v3.yml
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html ministage-complete.js tools/apply_auth_waitlist_v3.py .github/workflows/apply-auth-waitlist-v3.yml
          git commit -m "Completa autorizzazione uscita e verifica lista attesa"
          git push
