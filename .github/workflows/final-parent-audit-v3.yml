name: Final parent browser audit v3
on:
  push:
    paths:
      - 'tools/final_parent_audit_v3.mjs'
      - '.github/workflows/final-parent-audit-v3.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax current release
        run: |
          node --check ministage-complete.js
          node --check ministage-admin-console-v2.js
          grep -F "2026.09-parent-release-v6" ministage-complete.js
          grep -F "v=20260906j" index.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser audit published site
        run: node tools/final_parent_audit_v3.mjs
      - name: Cleanup temporary audit
        if: always()
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git pull --rebase || true
          git rm -f tools/final_parent_audit_v3.mjs .github/workflows/final-parent-audit-v3.yml || true
          git commit -m "Rimuove strumenti temporanei collaudo browser finale" || true
          git push || true
