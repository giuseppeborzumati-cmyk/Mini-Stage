name: Aggiorna dicitura LS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-ls-label.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna dicitura
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'LS - Liceo Scientifico (Scienze Applicate & Curvatura Economica)'
          new = 'LS - Liceo Scientifico opzione Scienze Applicate - Liceo Scientifico opzione Scienze Applicate - Curvatura Economica'

          # Sostituzione diretta in tutti i sorgenti testuali del sito.
          for name in ['index.html','ministage-complete.js','ministage-admin-console-v2-original.js','ministage-admin-console-v2.js','ministage-pdf-date-extension.js']:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          # Compatibilita: se la vecchia etichetta arriva da Firebase o da una cache,
          # getIndirizzoLabel la converte sempre nella nuova dicitura.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '        const INDIRIZZI_LABELS = {'
          if marker in text and old not in text:
              insert = f'        const LEGACY_LS_COMBINED_LABEL = {old!r};\n        const NEW_LS_COMBINED_LABEL = {new!r};\n\n'
              text = text.replace(marker, insert + marker, 1)
              needle = "        window.getIndirizzoLabel = function(indirizzo) {\n            const label = INDIRIZZI_LABELS[indirizzo] || indirizzo || '';"
              replacement = "        window.getIndirizzoLabel = function(indirizzo) {\n            if (String(indirizzo || '').trim() === LEGACY_LS_COMBINED_LABEL) return NEW_LS_COMBINED_LABEL;\n            const label = INDIRIZZI_LABELS[indirizzo] || indirizzo || '';"
              if needle in text:
                  text = text.replace(needle, replacement, 1)
          # cache bust del wrapper docente se presente
          import re
          text = re.sub(r'ministage-admin-console-v2\.js\?v=[^\"\']+', 'ministage-admin-console-v2.js?v=20260907-lslabel1', text)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verifica modifica
        run: |
          grep -q "NEW_LS_COMBINED_LABEL" index.html
          grep -q "LS - Liceo Scientifico opzione Scienze Applicate - Liceo Scientifico opzione Scienze Applicate - Curvatura Economica" index.html
      - name: Commit e pulizia
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html ministage-complete.js ministage-admin-console-v2-original.js ministage-admin-console-v2.js ministage-pdf-date-extension.js
          git rm .github/workflows/rename-ls-label.yml
          git commit -m "Sostituisce dicitura LS liceo scientifico"
          git push
