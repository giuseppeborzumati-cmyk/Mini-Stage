name: Apply MiniStage exit authorization v2
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-exit-authorization-v2.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch authorization flow and teacher visibility
        run: |
