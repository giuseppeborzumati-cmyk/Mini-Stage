      - name: Browser verification without creating bookings
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1400,height:1000}});
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8000/?verify=exit-auth-v2',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.__MINISTAGE_COMPLETE__?.uiReady && window.__MINISTAGE_ADMIN_CONSOLE_V2__?.version,{timeout:25000});
            const result=await page.evaluate(()=>{
              const mode=document.getElementById('mini-exit-mode');
              mode.value='autonoma'; mode.dispatchEvent(new Event('change',{bubbles:true}));
              return {
                authText:document.getElementById('mini-declaration-text')?.textContent||'',
                notice:document.getElementById('mini-exit-notice')?.textContent||'',
                noticeHidden:document.getElementById('mini-exit-notice')?.classList.contains('hidden'),
                dl:typeof window.downloadMiniStageBookingPdf,
                teacherText:document.getElementById('mini-admin-console-v2')?.textContent||''
              };
            });
            console.log('EXIT_AUTH_V2_STATE',JSON.stringify(result));
            assert(/Autorizzo espressamente/i.test(result.authText),'Spunta autorizzazione non esplicita');
            assert(/seconda pagina/i.test(result.notice) && !result.noticeHidden,'Avviso seconda pagina non visibile');
            assert(result.dl==='function','Download PDF docente non disponibile');
            assert(/Autorizzazioni uscita autonoma/i.test(result.teacherText),'Sezione docente autorizzazioni mancante');
            assert(errors.length===0,'Errori JS: '+errors.join(' | '));
            console.log('EXIT_AUTH_V2_BROWSER_OK');
            await browser.close();
          })().catch(e=>{console.error('EXIT_AUTH_V2_BROWSER_FAIL',e);process.exit(1)});
          NODE
      - name: Commit changes and remove temporary workflow
        run: |
