name: Audit docente one page v4
on:
  push:
    paths:
      - 'tools/audit-admin-onepage-v4.mjs'
      - '.github/workflows/audit-admin-onepage-v4.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for published one page
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsSL "https://giuseppeborzumati-cmyk.github.io/Mini-Stage/?v=onepage-${i}-$(date +%s)" | grep -q "v=20260906k"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser audit docente one page
        run: node tools/audit-admin-onepage-v4.mjs
      - name: Cleanup audit tools
        if: always()
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git pull --rebase || true
          git rm -f tools/audit-admin-onepage-v4.mjs .github/workflows/audit-admin-onepage-v4.yml || true
          git commit -m "Rimuove strumenti temporanei collaudo area docente" || true
          git push || true
