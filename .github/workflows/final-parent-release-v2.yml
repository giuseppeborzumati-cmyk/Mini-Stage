name: Final parent release MiniStage
on:
  push:
    paths:
      - 'tools/final_parent_hardening_v2.py'
      - 'tools/final_parent_audit_v2.mjs'
      - '.github/workflows/final-parent-release-v2.yml'
permissions:
  contents: write
jobs:
  harden-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply parent hardening
        run: python tools/final_parent_hardening_v2.py

      - name: Syntax and static guards
        run: |
          node --check ministage-complete.js
          node --check ministage-admin-console-v2.js
          grep -F "2026.09-parent-release-v6" ministage-complete.js
          grep -F "canonicalIndirizzo" ministage-complete.js
          grep -F "Classi assegnate salvate e prenotazioni aggiornate" ministage-complete.js
          grep -F "font-size: 16px !important" index.html
          grep -F "cancelledBooking" index.html
          grep -F "v=20260906j" index.html
          echo PARENT_RELEASE_STATIC_OK

      - name: Commit hardened release
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html ministage-complete.js
          git commit -m "Finalizza affidabilita mobile e coerenza prenotazioni" || true
          git push

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages hardened release
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsSL "https://giuseppeborzumati-cmyk.github.io/Mini-Stage/?v=parent-release-${i}-$(date +%s)" | grep -q "v=20260906j"; then
              ok=1
              echo "PAGES_PARENT_RELEASE_VISIBLE"
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Browser audit on published site
        run: node tools/final_parent_audit_v2.mjs

      - name: Cleanup temporary audit tools
        if: always()
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git pull --rebase || true
          git rm -f tools/final_parent_hardening_v2.py tools/final_parent_audit_v2.mjs .github/workflows/final-parent-release-v2.yml || true
          git commit -m "Rimuove strumenti temporanei collaudo genitori" || true
          git push || true
