name: Corregge separatore percorso liceale

on:
  push:
    branches: [main]
    paths:
      - 'tools/normalize_liceo_separator.py'
      - '.github/workflows/normalize-liceo-separator.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Applica correzione etichetta liceo
        run: python tools/normalize_liceo_separator.py

      - name: Verifica JavaScript
        run: |
          node --check ministage-complete.js
          node --check ministage-admin-console-v2.js
          node --check ministage-admin-console-v2-original.js
          node --check ministage-pdf-date-extension.js

      - name: Verifica etichetta corretta
        run: |
          grep -q "Scienze Applicate - Curvatura Economica" index.html
          if grep -R -n --include='*.html' --include='*.js' "Scienze Applicate & Curvatura Economica" .; then
            echo "Trovata ancora la vecchia etichetta con &"
            exit 1
          fi
          echo "SEPARATORE_LICEO_OK"

      - name: Pubblica e ripulisce strumenti temporanei
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git add index.html ministage-complete.js ministage-admin-console-v2.js ministage-admin-console-v2-original.js ministage-pdf-date-extension.js
          git rm tools/normalize_liceo_separator.py .github/workflows/normalize-liceo-separator.yml
          git commit -m "Corregge trattino nel percorso liceale"
          git push
