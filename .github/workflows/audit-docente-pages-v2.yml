name: Audit docente pages v2
on:
  push:
    paths:
      - '.github/workflows/audit-docente-pages-v2.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source
        run: |
          node --check ministage-admin-console-v2.js
          grep -F "2026.09-docente-pagine-v5" ministage-admin-console-v2.js
          grep -F "ministage-admin-console-v2.js?v=20260906m" index.html
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser audit
        run: node tools/audit-docente-pages-v2.mjs
      - name: Cleanup temporary audit
        if: always()
        run: |
          git config user.name "giuseppeborzumati-cmyk"
          git config user.email "giuseppe.borzumati@leviseregno.edu.it"
          git pull --rebase || true
          git rm -f tools/audit-docente-pages-v2.mjs .github/workflows/audit-docente-pages-v2.yml || true
          git commit -m "Rimuove collaudo temporaneo area docente a pagine" || true
          git push || true