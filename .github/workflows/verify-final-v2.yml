name: Verify MiniStage final v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-final-v2.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static
        run: |
          node --check ministage-complete.js
          ! grep -Eq '2026-11-06|2026-11-20|06/11/2026|20/11/2026' index.html ministage-complete.js
      - name: Browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null
          npx playwright install chromium >/dev/null
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium }=require('playwright');
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1365,height:1000}});
            page.setDefaultTimeout(15000);
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8000/?verify=v2',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>typeof window.showAdminView==='function' && typeof window.openManageBookingModal==='function');
            await page.evaluate(()=>window.goToHome());
            ok(!(await page.locator('#view-home').evaluate(e=>e.classList.contains('hidden'))),'Home');
            ok(await page.getByText('Descrizione dei MiniStage',{exact:true}).count()===1,'Descrizione');
            ok(await page.getByText('Liceo Scientifico - Opzione Scienze Applicate con Curvatura Economica',{exact:true}).count()>=1,'Curvatura');
            await page.getByRole('button',{name:'Recupera Prenotazione'}).click(); ok(!(await page.locator('#manage-booking-modal').evaluate(e=>e.classList.contains('hidden'))),'Recupera'); await page.evaluate(()=>window.closeManageBookingBookingModal());
            await page.getByRole('button',{name:'Cancella Prenotazione'}).click(); ok(!(await page.locator('#manage-booking-modal').evaluate(e=>e.classList.contains('hidden'))),'Cancella'); await page.evaluate(()=>window.closeManageBookingBookingModal());
            await page.getByRole('button',{name:/Accesso Commissione Orientamento/i}).click(); ok(!(await page.locator('#view-admin').evaluate(e=>e.classList.contains('hidden'))),'Commissione'); await page.evaluate(()=>window.goToHome());
            await page.waitForFunction(()=>window.__MINISTAGE_COMPLETE__?.uiReady===true,{timeout:8000});
            for(const fn of ['openWaitlistModal','downloadWaitlistPdf','downloadAllClassListsPdf','createSmartphoneScannerLink']) ok(await page.evaluate(fn=>typeof window[fn]==='function',fn),fn);
            await page.evaluate(()=>window.openBookingModal('TEST-ONLY','Liceo Scientifico - Scienze Applicate','Giorno','data manuale','14:30 - 16:30')); ok(!(await page.locator('#booking-modal').evaluate(e=>e.classList.contains('hidden'))),'Prenota'); ok(await page.locator('#mini-exit-auth').count()===1,'Autorizzazione'); await page.evaluate(()=>window.closeModal());
            await page.evaluate(()=>window.openWaitlistModal('TEST-ONLY','Liceo Scientifico - Scienze Applicate','Giorno','data manuale','14:30 - 16:30')); ok(/Lista d'Attesa/i.test(await page.locator('#booking-modal h3').innerText()),'Lista attesa'); await page.evaluate(()=>window.closeModal());
            ok(errors.length===0,'JS: '+errors.join(' | '));
            console.log('MINISTAGE_FINAL_V2_OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
